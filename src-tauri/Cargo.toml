[package]
name = "kiru"
version = "0.1.0"
description = "Kiru - a modern anime, comic and novel client"
authors = ["Smilecover"]
edition = "2024"

[lib]
name = "kiru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "socks", "gzip", "brotli", "deflate"] }
reqwest_cookie_store = "0.8"
cookie = "0.18"
base64 = "0.22"
url = "2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = "0.8"
roxmltree = "0.20"
uuid = { version = "1", features = ["v4"] }
regex = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
